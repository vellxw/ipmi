name: Build Dictadito Android shell

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore generic Android shell source
        run: |
          mkdir -p dictadito-builder
          cat dictadito-builder.part-{1,2,3,4,5}.b64 | base64 -d > dictadito-builder.tar.gz
          tar -xzf dictadito-builder.tar.gz -C dictadito-builder
          python - <<'PY'
          from pathlib import Path
          path = Path('dictadito-builder/app/build.gradle')
          text = path.read_text()
          if 'buildFeatures {' not in text:
              text = text.replace('    compileOptions {', '    buildFeatures {\n        buildConfig true\n    }\n\n    compileOptions {')
              path.write_text(text)
          PY

      - name: Generate Gradle wrapper
        working-directory: dictadito-builder
        run: gradle wrapper --gradle-version 8.7

      - name: Compile debug and unsigned release APKs
        working-directory: dictadito-builder
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify APK outputs
        run: |
          test -s dictadito-builder/app/build/outputs/apk/debug/app-debug.apk
          test -s dictadito-builder/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APKs and wrapper
        uses: actions/upload-artifact@v4
        with:
          name: dictadito-android-shell
          path: |
            dictadito-builder/app/build/outputs/apk/debug/app-debug.apk
            dictadito-builder/app/build/outputs/apk/release/app-release-unsigned.apk
            dictadito-builder/gradlew
            dictadito-builder/gradlew.bat
            dictadito-builder/gradle/wrapper/gradle-wrapper.jar
            dictadito-builder/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 3
